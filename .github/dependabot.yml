# Houdt de vastgezette versies bij. Zonder dit verouderen de SHA-pins in
# .github/workflows/ stil: niets in CI klaagt over een actie van twee jaar oud.
version: 2

updates:
  # De SHA-pins in de workflows. Dependabot werkt zowel de SHA als het
  # versie-comment erachter bij, dus de pin blijft een pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Klein onderhoud in een PR; een major krijgt zijn eigen PR, want die
      # wil je los kunnen lezen.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # De monorepo. Dekt alle workspaces via de root package-lock.json:
  # linkedin-crm-backend, linkedin-crm-extension, website en packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Een major is hier geen onderhoud maar een migratie: prisma 5 -> 7 raakt
      # de schema-laag, tailwind 3 -> 4 de hele website. Zulke PR's blijven
      # maanden staan en leren je de lijst te negeren. @types/node hoort bij
      # de node-version in de workflows (20), dus die mag al helemaal niet
      # vooruitlopen. Majors doe je bewust, niet omdat er een PR openstond.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Onder 1.0 is een minor wél breaking, en Dependabot groepeert hem toch
      # bij het kleine onderhoud. auth-helpers-nextjs is bovendien door
      # Supabase afgeschreven ("please use the @supabase/ssr package
      # instead"); 0.15 heeft createClientComponentClient niet meer, dus dit
      # pakket wil vervangen worden en niet opgehoogd.
      - dependency-name: "@supabase/auth-helpers-nextjs"
        update-types: [version-update:semver-minor]

  # ui is bewust geen workspace-lid en heeft een eigen lockfile, dus de root
  # hierboven ziet hem niet.
  - package-ecosystem: npm
    directory: /linkedin-crm-extension/ui
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      extension-ui:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Deze workspace staat bewust op een oudere, samenhangende toolchain:
      # eslint 8 met typescript-eslint 7 en react-hooks 4, React 18 met zijn
      # @types, vite 5 met vitest 3 en @vitejs/plugin-react 4. Die onderdelen
      # bewegen alleen samen. Een major op een van de losse delen levert een
      # PR op die niet kan slagen, week na week. Optillen doe je in een eigen
      # wijziging die de hele set tegelijk meeneemt.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Dezelfde 0.x-val als hierboven, twee keer:
      # eslint-plugin-react-refresh 0.5 eist eslint 9 of 10 als peer en deze
      # workspace draait 8, en @types/chrome 0.1+ maakt de callback-types
      # strenger (unknown in plaats van any), goed voor negen nieuwe
      # typefouten. Allebei op te lossen, allebei eigen werk.
      - dependency-name: eslint-plugin-react-refresh
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/chrome"
        update-types: [version-update:semver-minor]
