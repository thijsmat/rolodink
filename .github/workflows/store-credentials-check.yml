name: Store Credentials Check

# Handmatige smoke-test voor de store-secrets, zonder iets te publiceren.

on:
  workflow_dispatch:

permissions: {}

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Check Chrome Web Store credentials
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ] && missing="$missing CHROME_CLIENT_ID"
          [ -z "$CLIENT_SECRET" ] && missing="$missing CHROME_CLIENT_SECRET"
          [ -z "$REFRESH_TOKEN" ] && missing="$missing CHROME_REFRESH_TOKEN"
          [ -z "$EXTENSION_ID" ] && missing="$missing CHROME_EXTENSION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Ontbrekende secrets:$missing"
            exit 1
          fi

          code=$(curl -s -o token.json -w "%{http_code}" https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          if [ "$code" != "200" ]; then
            echo "::error::Token-exchange faalde (HTTP $code): $(jq -r '(.error // "onbekend") + " - " + (.error_description // "")' token.json)"
            exit 1
          fi
          echo "OAuth-credentials geldig: access token verkregen."

          token=$(jq -r .access_token token.json)
          rm -f token.json

          code=$(curl -s -o item.json -w "%{http_code}" \
            -H "Authorization: Bearer $token" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID?projection=DRAFT")
          if [ "$code" = "200" ]; then
            echo "Extension ID gevonden in Chrome Web Store; credentials zijn compleet."
          else
            echo "::error::Listing-check faalde (HTTP $code). Bestaat de extensie al in de Web Store en hoort CHROME_EXTENSION_ID bij dit account?"
            jq -r '.error.message // .' item.json 2>/dev/null || cat item.json
            exit 1
          fi

  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Check Edge Add-ons credentials
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          missing=""
          [ -z "$PRODUCT_ID" ] && missing="$missing EDGE_PRODUCT_ID"
          [ -z "$CLIENT_ID" ] && missing="$missing EDGE_CLIENT_ID"
          [ -z "$API_KEY" ] && missing="$missing EDGE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Ontbrekende secrets:$missing"
            exit 1
          fi

          # Read-only probe naar een niet-bestaande operation: geldige credentials
          # geven 404 (operation onbekend), afgewezen credentials geven 401/403.
          code=$(curl -s -o resp.json -w "%{http_code}" \
            -H "Authorization: ApiKey $API_KEY" \
            -H "X-ClientID: $CLIENT_ID" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions/draft/package/operations/00000000-0000-0000-0000-000000000000")
          case "$code" in
            401|403)
              echo "::error::Edge-credentials afgewezen (HTTP $code). Controleer EDGE_CLIENT_ID en EDGE_API_KEY (Partner Center > Publish API)."
              exit 1
              ;;
            *)
              echo "Edge-credentials geaccepteerd door de API (HTTP $code op de probe)."
              echo "Let op: of EDGE_PRODUCT_ID exact klopt, blijkt definitief pas bij de eerste echte upload."
              ;;
          esac
