name: GitHub Flow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# A newer push to the same PR makes the running checks moot. On main every
# commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the monorepo this push or PR touches. A job for a part that
  # did not change is skipped, and GitHub counts a skipped job as passed for
  # branch protection. Plain git, no third-party action.
  #
  # Anything shared - packages/, the root package files, turbo.json, this
  # workflow - counts as a change to every part. When there is nothing to
  # compare against (a new branch, a force push), everything runs.
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      website: ${{ steps.diff.outputs.website }}
      extension: ${{ steps.diff.outputs.extension }}
      code: ${{ steps.diff.outputs.code }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Find changed paths
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          RANGE="$PR_BASE...$PR_HEAD"
        else
          RANGE="$PUSH_BEFORE..$PUSH_AFTER"
        fi
        if ! FILES=$(git diff --name-only "$RANGE" 2>/dev/null); then
          echo "No usable diff for $RANGE - running everything"
          for part in backend website extension code; do echo "$part=true" >> "$GITHUB_OUTPUT"; done
          exit 0
        fi
        echo "$FILES"
        shared='^(packages/|package\.json$|package-lock\.json$|turbo\.json$|\.github/workflows/github-flow\.yml$)'
        has() { if echo "$FILES" | grep -Eq "$1|$shared"; then echo true; else echo false; fi; }
        # tools/ (tools/firefox-sign: the pinned web-ext for publish-firefox.yml)
        # belongs to the extension, so a change there runs the extension job.
        {
          echo "backend=$(has '^linkedin-crm-backend/')"
          echo "website=$(has '^website/')"
          echo "extension=$(has '^(linkedin-crm-extension|tools)/')"
          echo "code=$(has '^(linkedin-crm-backend|website|linkedin-crm-extension)/')"
        } | tee -a "$GITHUB_OUTPUT"

  # Website Build & Test
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci --ignore-scripts
      
    - name: Run linting
      run: npm run lint
      working-directory: ./website
      
    # The lockfile-pinned binary from the root install, not npx: npx fetches
    # from the registry when a package is missing.
    - name: Run type checking
      run: ../node_modules/.bin/tsc --noEmit
      working-directory: ./website
      
    - name: Build website
      run: npm run build
      working-directory: ./website
      
    - name: Test build output
      run: |
        if [ ! -d "website/.next" ]; then
          echo "Build failed - .next directory not found"
          exit 1
        fi
        echo "Build successful"

  # Extension Build & Test
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          linkedin-crm-extension/ui/package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci --ignore-scripts
      
    - name: Install extension UI dependencies
      run: npm ci --ignore-scripts
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Run TypeScript type check
      run: npm run typecheck
      working-directory: ./linkedin-crm-extension/ui
      continue-on-error: false
      
    # `--max-warnings 35` in the ui lint script is a ratchet, and it was being
    # ignored: `continue-on-error: true` here swallowed the failure, so the
    # budget could be exceeded without CI noticing. Current count is 33.
    - name: Run linting (extension)
      run: npm run lint
      working-directory: ./linkedin-crm-extension/ui

    # The content script's DOM logic, tested against real captures of LinkedIn's
    # markup. `ui` is not an npm workspace member, so `turbo run test` in the
    # `backend` job does not reach it - it has to be run here or not at all.
    - name: Run tests (extension UI)
      run: npm test
      working-directory: ./linkedin-crm-extension/ui

    # No separate `npm run build`: build.js runs it once for all three
    # targets below, and fails when the UI build leaves no output.

    # No separate install for build.js: linkedin-crm-extension is a workspace
    # member, so its fs-extra and archiver come in with the root `npm ci` at
    # the top of this job and resolve up the directory tree. A `npm install`
    # here would be both redundant and unlocked (Sonar S8543/S6505).

    # Package with the REAL release script. Packaging previously only ever ran
    # on an ext-v* tag, so a broken package surfaced at the worst possible
    # moment - during a release.
    #
    # One call for all three targets: the UI is built once and packaged three
    # times, and the Firefox post-build rewrites only Firefox's own copy.
    # release.yml still calls build.js once per target; both paths produce
    # byte-identical packages.
    #
    # The VITE_ values are dummies, and they are what makes this the bundle
    # users get. Without them the Supabase client is dead code (`supabase` is
    # null when the URL is missing) and Vite drops it: CI then checked an 8 KB
    # background.js while the release shipped 226 KB. Every VITE_ variable
    # release.yml passes is covered, plus VITE_WEBSITE_URL, which the source
    # reads with a fallback. They are public client configuration, not
    # secrets; the dummies point at nothing.
    - name: Package extension (chrome, edge, firefox) with one UI build
      working-directory: ./linkedin-crm-extension
      env:
        VITE_SUPABASE_URL: 'https://dummy.supabase.co'
        VITE_SUPABASE_ANON_KEY: 'dummy-anon-key'
        VITE_API_BASE_URL: 'https://dummy.rolodink.app'
        VITE_WEBSITE_URL: 'https://dummy.rolodink.app'
      run: node build.js chrome edge firefox

    # The bundle has to be the real one, and it has to stay within budget.
    #
    # Floor: background.js must contain the Supabase auth client and weigh at
    # least 100 KB. If not, the env above stopped reaching the build and every
    # check below is looking at the stripped bundle, not the one users install.
    #
    # Ceilings: measured on 2026-10-01 with the env above, plus 10%.
    #   background.js             226064 -> 248670
    #   content.js                 17661 ->  19427
    #   popup assets/index-*.js   438906 -> 482797
    # Growing past one is allowed, but as a decision: raise the number here in
    # the same PR and say why.
    #
    # Raised: content.js 19427 -> 22000. The note card now sends the version
    # it last saw with every save, and on a 409 ("changed elsewhere") offers
    # Load other version / Overwrite / Undo instead of silently overwriting a
    # note saved in the popup or on another device. Measured 21859 bytes with
    # that (19106 before it), so the new ceiling is that plus a small margin,
    # not another 10%.
    - name: Verify the real bundle and the size budget
      run: |
        fail=0
        check_max() { # file max label
          size=$(stat -c%s "$1")
          if [ "$size" -gt "$2" ]; then
            echo "::error::$3 is $size bytes, over its budget of $2"
            fail=1
          else
            echo "$3: $size bytes (budget $2)"
          fi
        }
        for t in chrome edge firefox; do
          dir="dist/tmp/$t"
          bg="$dir/background.js"
          if ! grep -q GoTrueClient "$bg"; then
            echo "::error::$t background.js has no GoTrueClient - the Supabase client was eliminated, this is not the bundle users get"
            fail=1
          fi
          bg_size=$(stat -c%s "$bg")
          if [ "$bg_size" -lt 102400 ]; then
            echo "::error::$t background.js is $bg_size bytes, under the 100 KB floor - not the real bundle"
            fail=1
          fi
          check_max "$bg" 248670 "$t background.js"
          check_max "$dir/content.js" 22000 "$t content.js"
          popups=$(find "$dir/assets" -maxdepth 1 -name 'index-*.js')
          if [ "$(printf '%s\n' "$popups" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one popup bundle in $dir/assets, found: $popups"
            fail=1
          fi
          for f in $popups; do check_max "$f" 482797 "$t popup $(basename "$f")"; done
        done
        exit $fail

    # Prove the content script in the package is the Vite bundle, not the raw
    # source. This guards the failure mode that used to be invisible: a copy
    # step silently replacing the bundle after the build, leaving a green
    # build with the old content script in the zip.
    - name: Verify the chrome package (content script bundle, manifest key)
      working-directory: ./linkedin-crm-extension
      run: |
        CONTENT=../dist/tmp/chrome/content.js
        test -f "$CONTENT" || { echo "content.js missing from package"; exit 1; }
        SIZE=$(stat -c%s "$CONTENT")
        if [ "$SIZE" -lt 2048 ]; then
          echo "content.js suspiciously small ($SIZE bytes) - not a real bundle"
          exit 1
        fi
        grep -q "rolodink-enc:" "$CONTENT" || { echo "encryption prefix missing - wrong file in package"; exit 1; }
        if grep -q "@rolodink/core" "$CONTENT"; then
          echo "content.js still contains an unbundled import - this is the raw source, not the bundle"
          exit 1
        fi
        echo "content.js is the bundle ($SIZE bytes)"

        # The packaged manifest must carry the store's public key, or an
        # unpacked build gets a path-derived ID and its OAuth redirect
        # (https://<id>.chromiumapp.org/provider_cb) no longer matches
        # Supabase's allowlist - login then fails only when tested locally.
        node -e '
          const m = require("../dist/tmp/chrome/manifest.json");
          const expected = require("./extension-keys.json").chrome.id;
          if (!m.key) { console.error("manifest.key missing from the chrome package"); process.exit(1); }
          const d = require("node:crypto").createHash("sha256").update(Buffer.from(m.key, "base64")).digest();
          const id = [...d.subarray(0, 16)].flatMap(b => [b >> 4, b & 15])
            .map(n => String.fromCodePoint(97 + n)).join("");
          if (id !== expected) { console.error(`packaged key yields ${id}, expected ${expected}`); process.exit(1); }
          console.log(`chrome package is pinned to ${id}`);
        '

    # The mirror image, and the guard that was missing when it mattered. Edge's
    # Partner Center rejects a manifest carrying `key` - "The manifest
    # shouldn't contain the key field" - so the v1.3.4 Edge submission failed
    # validation while Chrome accepted the same field without complaint. That
    # only surfaced after the release was published, because packaging in CI
    # only ever built the chrome target.
    - name: Verify the edge package carries no manifest key
      working-directory: ./linkedin-crm-extension
      run: |
        node -e '
          const m = require("../dist/tmp/edge/manifest.json");
          if (m.key) {
            console.error("manifest.key present in the edge package - Partner Center will reject this upload");
            process.exit(1);
          }
          const chrome = require("../dist/tmp/chrome/manifest.json");
          const differing = [...new Set([...Object.keys(m), ...Object.keys(chrome)])]
            .filter(k => JSON.stringify(m[k]) !== JSON.stringify(chrome[k]));
          if (differing.join() !== "key") {
            console.error(`edge and chrome manifests differ in more than the key: ${differing.join(", ")}`);
            process.exit(1);
          }
          console.log("edge package carries no key and is otherwise identical to chrome");
        '

    # Firefox used to overwrite the bundle with its own content-firefox.js, so
    # "does the Firefox package contain the same content script as the others"
    # had no answer that CI could give - and the answer was no, for as long as
    # anyone had been shipping fixes to it.
    - name: Verify the firefox package ships the same bundle
      working-directory: ./linkedin-crm-extension
      run: |
        FIREFOX=../dist/tmp/firefox/content.js
        CHROME=../dist/tmp/chrome/content.js
        test -f "$FIREFOX" || { echo "content.js missing from the firefox package"; exit 1; }
        # Checked on content rather than by comparing bytes: firefox-postbuild
        # .cjs rewrites the firefox copy for AMO's linter (block comments
        # stripped, .innerHTML= rewritten), so byte equality is not something
        # to depend on even when it happens to hold. What must hold is that
        # Firefox ships the bundle rather than a hand-maintained fork.
        grep -q "rolodink-enc:" "$FIREFOX" || { echo "encryption prefix missing - wrong file in package"; exit 1; }
        grep -q "rolodink-context-field" "$FIREFOX" || {
          echo "the note card is missing from the firefox package - is this the old content-firefox.js?"
          exit 1
        }
        SIZE=$(stat -c%s "$FIREFOX")
        CHROME_SIZE=$(stat -c%s "$CHROME")
        # The old fork was 353 lines against 900. Anything close to half the
        # Chrome bundle is not the same content script.
        if [ "$SIZE" -lt $((CHROME_SIZE * 3 / 4)) ]; then
          echo "firefox content.js is $SIZE bytes against chrome's $CHROME_SIZE - not the same bundle"
          exit 1
        fi
        node -e '
          const m = require("../dist/tmp/firefox/manifest.json");
          if (m.key) { console.error("manifest.key present in the firefox package"); process.exit(1); }
          if (!m.browser_specific_settings?.gecko?.id) {
            console.error("browser_specific_settings.gecko.id missing - AMO needs it to identify the add-on");
            process.exit(1);
          }
          console.log(`firefox package is ${m.browser_specific_settings.gecko.id}`);
        '
        echo "firefox ships the bundle ($SIZE bytes against chrome's $CHROME_SIZE)"

  # Unit tests for the monorepo workspaces, plus the backend's lint,
  # typecheck and build. One job, one root install, one `prisma generate`.
  #
  # The tests used to be a job of their own that repeated this job's install
  # and Prisma step word for word. `turbo run test` reaches exactly two
  # workspaces - linkedin-crm-backend and packages/core - and both are served
  # by this install, so a second runner bought nothing but a second install.
  #
  # The job runs on any code change, not only a backend one: the backend's
  # version.test.ts compares LATEST_EXTENSION_VERSION with both extension
  # manifests, so an extension-only version bump has to reach the tests. The
  # backend-only steps (lint, typecheck, build) keep their own `backend`
  # condition below. packages/core's tests - including the fixed ciphertext
  # vector that pins the encryption wire format - run on every code change.
  #
  # `turbo run test` runs every workspace that declares a `test` script, so a
  # new suite is covered the moment it is added and this file needs no change.
  # Not covered here: linkedin-crm-extension/ui has its own lockfile and is not
  # a workspace member, so turbo cannot see it; the `extension` job runs it.
  backend:
    name: backend + tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
      DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    # --ignore-scripts: a dependency's install hook runs arbitrary code with
    # the job's token and cache. Nothing in this workflow needs one, so every
    # job installs with them off; where a hook did real work (the backend's
    # `prisma generate`), the job runs that step explicitly.
    - name: Install dependencies (monorepo root)
      run: npm ci --ignore-scripts

    # --ignore-scripts above also skips the backend's postinstall, so the
    # Prisma Client is generated explicitly. `prisma generate` needs no
    # database. (No `npm audit` here: it was set to never fail. Trivy in the
    # security job is the dependency gate.)
    #
    # `npm run` rather than `npx`: npx will fetch a package from the registry
    # when it is not installed locally, which turns a typo or a deleted
    # dependency into remote code execution at whatever version resolves today.
    # `npm run` only ever executes the binary the lockfile pinned.
    - name: Generate Prisma Client
      run: npm run prisma:generate
      working-directory: ./linkedin-crm-backend

    # Root script, which is `turbo run test`: linkedin-crm-backend and
    # packages/core. Runs on every code change (see the job comment).
    - name: Run tests (backend and packages/core)
      run: npm test

    - name: Run linting
      if: needs.changes.outputs.backend == 'true'
      run: npm run lint
      working-directory: ./linkedin-crm-backend

    - name: Run type checking
      if: needs.changes.outputs.backend == 'true'
      run: ../node_modules/.bin/tsc --noEmit
      working-directory: ./linkedin-crm-backend

    - name: Build backend
      if: needs.changes.outputs.backend == 'true'
      run: npm run build
      working-directory: ./linkedin-crm-backend

  # Security Scan
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF results
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
      
    - name: Aqua Security Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      # Use v4 - v1/v2 are deprecated and can fail the job, en v3 draait nog
      # op node20
      uses: github/codeql-action/upload-sarif@v4
      # Only try to upload SARIF when running in the repository (skip uploads on fork PRs)
      if: ${{ github.event_name != 'pull_request' }}
      with:
        sarif_file: 'trivy-results.sarif'

  # The one check to require in branch protection. It passes when every job
  # above passed or was skipped for lack of changes, and fails otherwise, so
  # the required-checks list no longer has to track which jobs exist.
  ci-ok:
    if: always()
    needs: [changes, website, extension, backend, security]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: All jobs passed or were skipped
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A job ended in '$result'"; exit 1 ;;
          esac
        done

  # Deploy to Staging (develop branch)
  deploy-staging:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/develop'
    needs: [ci-ok]
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add staging deployment commands here
        echo "Deploying to staging environment"
        # Add staging deployment commands here

  # Deploy to Production (main branch)
  deploy-production:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        # Add production deployment commands here
