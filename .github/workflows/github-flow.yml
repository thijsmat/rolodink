name: GitHub Flow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Unit tests across the monorepo workspaces.
  #
  # Until this job existed, no workflow in this repository ran a single test:
  # the other jobs run lint, typecheck and build only. packages/core's 74 tests
  # - including the fixed ciphertext vector that pins the encryption wire
  # format - had never been executed by CI, which made them documentation
  # rather than a gate.
  #
  # `turbo run test` runs every workspace that declares a `test` script, so a
  # new suite is covered the moment it is added and this file needs no change.
  #
  # Not covered: linkedin-crm-extension/ui has its own lockfile, is not a
  # workspace member, and has no test runner yet.
  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # --ignore-scripts: a dependency's install hook runs arbitrary code with
    # the job's token and cache. Nothing here needs one, so they stay off. The
    # other jobs in this file still install without it; changing them belongs
    # with whoever verifies their builds still work.
    - name: Install dependencies (monorepo root)
      run: npm ci --ignore-scripts

    # The backend generates its Prisma Client from a postinstall hook, which
    # --ignore-scripts just suppressed, so it is generated explicitly here.
    # `prisma generate` needs no database and no DATABASE_URL.
    #
    # `npm run` rather than `npx`: npx will fetch a package from the registry
    # when it is not installed locally, which turns a typo or a deleted
    # dependency into remote code execution at whatever version resolves today.
    # `npm run` only ever executes the binary the lockfile pinned.
    - name: Generate Prisma Client
      run: npm run prisma:generate
      working-directory: ./linkedin-crm-backend

    # Root script, which is `turbo run test`. Same reasoning as above.
    - name: Run tests
      run: npm test

  # Website Build & Test
  website:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      working-directory: ./website
      
    - name: Run type checking
      run: npx tsc --noEmit
      working-directory: ./website
      
    - name: Build website
      run: npm run build
      working-directory: ./website
      
    - name: Test build output
      run: |
        if [ ! -d "website/.next" ]; then
          echo "Build failed - .next directory not found"
          exit 1
        fi
        echo "Build successful"

  # Extension Build & Test
  extension:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          linkedin-crm-extension/ui/package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci
      
    - name: Install extension UI dependencies
      run: npm ci
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate || echo "⚠️ npm audit found vulnerabilities - review output above"
      continue-on-error: true
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Run TypeScript type check
      run: npm run typecheck
      working-directory: ./linkedin-crm-extension/ui
      continue-on-error: false
      
    # `--max-warnings 35` in the ui lint script is a ratchet, and it was being
    # ignored: `continue-on-error: true` here swallowed the failure, so the
    # budget could be exceeded without CI noticing. Current count is 33.
    - name: Run linting (extension)
      run: npm run lint
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Build extension
      run: npm run build
      working-directory: ./linkedin-crm-extension/ui

    - name: Validate extension
      run: |
        if [ ! -f "linkedin-crm-extension/manifest.json" ]; then
          echo "Extension manifest not found"
          exit 1
        fi
        if [ ! -d "linkedin-crm-extension/ui/dist" ]; then
          echo "Extension build output not found"
          exit 1
        fi
        echo "Extension build successful"

    # No separate install for build.js: linkedin-crm-extension is a workspace
    # member, so its fs-extra and archiver come in with the root `npm ci` at
    # the top of this job and resolve up the directory tree. A `npm install`
    # here would be both redundant and unlocked (Sonar S8543/S6505).

    # Package with the REAL release script and prove the content script in the
    # package is the Vite bundle, not the raw source. This guards the failure
    # mode that used to be invisible: a copy step silently replacing the bundle
    # after the build, leaving a green build with the old content script in the
    # zip. Packaging previously only ever ran on an ext-v* tag, so a broken
    # package surfaced at the worst possible moment - during a release.
    - name: Package extension (chrome) and verify the content script bundle
      working-directory: ./linkedin-crm-extension
      run: |
        node build.js chrome
        CONTENT=../dist/tmp/chrome/content.js
        test -f "$CONTENT" || { echo "content.js missing from package"; exit 1; }
        SIZE=$(stat -c%s "$CONTENT")
        if [ "$SIZE" -lt 2048 ]; then
          echo "content.js suspiciously small ($SIZE bytes) - not a real bundle"
          exit 1
        fi
        grep -q "rolodink-enc:" "$CONTENT" || { echo "encryption prefix missing - wrong file in package"; exit 1; }
        if grep -q "@rolodink/core" "$CONTENT"; then
          echo "content.js still contains an unbundled import - this is the raw source, not the bundle"
          exit 1
        fi
        echo "content.js is the bundle ($SIZE bytes)"

        # The packaged manifest must carry the store's public key, or an
        # unpacked build gets a path-derived ID and its OAuth redirect
        # (https://<id>.chromiumapp.org/provider_cb) no longer matches
        # Supabase's allowlist - login then fails only when tested locally.
        node -e '
          const m = require("../dist/tmp/chrome/manifest.json");
          const expected = require("./extension-keys.json").chrome.id;
          if (!m.key) { console.error("manifest.key missing from the chrome package"); process.exit(1); }
          const d = require("crypto").createHash("sha256").update(Buffer.from(m.key, "base64")).digest();
          const id = [...d.subarray(0, 16)].flatMap(b => [b >> 4, b & 15])
            .map(n => String.fromCharCode(97 + n)).join("");
          if (id !== expected) { console.error(`packaged key yields ${id}, expected ${expected}`); process.exit(1); }
          console.log(`chrome package is pinned to ${id}`);
        '

  # Backend Build & Test
  backend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
      DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./linkedin-crm-backend
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate || echo "⚠️ npm audit found vulnerabilities - review output above"
      continue-on-error: true
      working-directory: ./linkedin-crm-backend
      
    - name: Run linting
      run: npm run lint
      working-directory: ./linkedin-crm-backend
      
    - name: Run type checking
      run: npx tsc --noEmit
      working-directory: ./linkedin-crm-backend
      
    - name: Build backend
      run: npm run build
      working-directory: ./linkedin-crm-backend

  # Security Scan
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF results
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Aqua Security Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      # Use v3 - v1/v2 are deprecated and can fail the job
      uses: github/codeql-action/upload-sarif@v3
      # Only try to upload SARIF when running in the repository (skip uploads on fork PRs)
      if: ${{ github.event_name != 'pull_request' }}
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Staging (develop branch)
  deploy-staging:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/develop'
    needs: [tests, website, extension, backend, security]
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add staging deployment commands here
        echo "Deploying to staging environment"
        # Add staging deployment commands here

  # Deploy to Production (main branch)
  deploy-production:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    needs: [tests, website, extension, backend, security]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        # Add production deployment commands here
