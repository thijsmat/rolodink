name: GitHub Flow CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Least privilege by default. Every other workflow in this repository already
# declares this at the top level; github-flow.yml was the one that did not, so
# its jobs ran with whatever the repository default grants. None of them writes
# to GitHub - they install, lint, typecheck, test and build. The `security` job
# overrides this with the `security-events: write` it needs to upload SARIF.
permissions:
  contents: read

jobs:
  # Unit tests across the monorepo workspaces.
  #
  # Until this job existed, no workflow in this repository ran a single test:
  # the other jobs run lint, typecheck and build only. packages/core's 74 tests
  # - including the fixed ciphertext vector that pins the encryption wire
  # format - had never been executed by CI, which made them documentation
  # rather than a gate.
  #
  # `turbo run test` runs every workspace that declares a `test` script, so a
  # new suite is covered the moment it is added and this file needs no change.
  #
  # Not covered: linkedin-crm-extension/ui has its own lockfile, is not a
  # workspace member, and has no test runner yet.
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies (monorepo root)
      run: npm ci

    # The backend has no test script on main yet - its suite arrives with the
    # open CORS pull request. Generating the client up front means that suite
    # runs here the moment it lands, rather than failing on a missing
    # @prisma/client import. `prisma generate` needs no database and no
    # DATABASE_URL.
    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./linkedin-crm-backend

    - name: Run tests
      run: npx turbo run test

  # Website Build & Test
  website:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      working-directory: ./website
      
    - name: Run type checking
      run: npx tsc --noEmit
      working-directory: ./website
      
    - name: Build website
      run: npm run build
      working-directory: ./website
      
    - name: Test build output
      run: |
        if [ ! -d "website/.next" ]; then
          echo "Build failed - .next directory not found"
          exit 1
        fi
        echo "Build successful"

  # Extension Build & Test
  extension:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          linkedin-crm-extension/ui/package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci
      
    - name: Install extension UI dependencies
      run: npm ci
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate || echo "⚠️ npm audit found vulnerabilities - review output above"
      continue-on-error: true
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Run TypeScript type check
      run: npm run typecheck
      working-directory: ./linkedin-crm-extension/ui
      continue-on-error: false
      
    # `--max-warnings 35` in the ui lint script is a ratchet, and it was being
    # ignored: `continue-on-error: true` here swallowed the failure, so the
    # budget could be exceeded without CI noticing. Current count is 33.
    - name: Run linting (extension)
      run: npm run lint
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Build extension
      run: npm run build
      working-directory: ./linkedin-crm-extension/ui
      
    - name: Validate extension
      run: |
        if [ ! -f "linkedin-crm-extension/manifest.json" ]; then
          echo "Extension manifest not found"
          exit 1
        fi
        if [ ! -d "linkedin-crm-extension/ui/dist" ]; then
          echo "Extension build output not found"
          exit 1
        fi
        echo "Extension build successful"

  # Backend Build & Test
  backend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
      DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      DIRECT_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies (monorepo root)
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./linkedin-crm-backend
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate || echo "⚠️ npm audit found vulnerabilities - review output above"
      continue-on-error: true
      working-directory: ./linkedin-crm-backend
      
    - name: Run linting
      run: npm run lint
      working-directory: ./linkedin-crm-backend
      
    - name: Run type checking
      run: npx tsc --noEmit
      working-directory: ./linkedin-crm-backend
      
    - name: Build backend
      run: npm run build
      working-directory: ./linkedin-crm-backend

  # Security Scan
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF results
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
      
    - name: Aqua Security Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      # Use v3 - v1/v2 are deprecated and can fail the job
      uses: github/codeql-action/upload-sarif@v3
      # Only try to upload SARIF when running in the repository (skip uploads on fork PRs)
      if: ${{ github.event_name != 'pull_request' }}
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Staging (develop branch)
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: [tests, website, extension, backend, security]
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add staging deployment commands here
        echo "Deploying to staging environment"
        # Add staging deployment commands here

  # Deploy to Production (main branch)
  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: [tests, website, extension, backend, security]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        # Add production deployment commands here
