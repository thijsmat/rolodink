name: Publish Firefox Extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-firefox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check store credentials
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          missing=""
          for v in FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Configure them under Settings > Secrets and variables > Actions before Firefox publishing can work."
            exit 1
          fi

      - name: Download Firefox Artifact
        id: download_artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release assets worden pas na het publiceren van de release geüpload,
          # dus wachten met retries in plaats van direct falen op de race.
          for i in $(seq 1 10); do
            gh release download ${{ github.event.release.tag_name }} -p "Rolodink-firefox-*.zip" --clobber || true
            if ls Rolodink-firefox-*.zip >/dev/null 2>&1; then
              break
            fi
            echo "Firefox asset not available yet (attempt $i/10), waiting 30s..."
            sleep 30
          done
          if ! ls Rolodink-firefox-*.zip >/dev/null 2>&1; then
            echo "::error::No Rolodink-firefox-*.zip asset found on release ${{ github.event.release.tag_name }}"
            exit 1
          fi
          echo "zip_file=$(ls Rolodink-firefox-*.zip)" >> $GITHUB_OUTPUT

      - name: Unzip Artifact
        run: |
          unzip ${{ steps.download_artifact.outputs.zip_file }} -d firefox-source
          echo "source_dir=firefox-source" >> $GITHUB_OUTPUT
        id: unzip_artifact

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Publish to Mozilla Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          web-ext sign \
            --channel listed \
            --source-dir ${{ steps.unzip_artifact.outputs.source_dir }} \
            --api-key $WEB_EXT_API_KEY \
            --api-secret $WEB_EXT_API_SECRET
