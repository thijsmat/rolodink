name: Publish Firefox Extension

on:
  release:
    types: [published]
  # A store upload that fails leaves nothing to retry: this workflow only ever
  # fired on `release: published`, so recovering meant unpublishing the release
  # and publishing it again. That is exactly the situation v1.3.4 landed in -
  # Chrome rejected an expired refresh token and Edge rejected the package, and
  # neither could be retried once the cause was fixed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose assets to publish, e.g. ext-v1.3.4'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-firefox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          # Geen npm-cache: de enige install hieronder is web-ext voor het
          # ondertekenen, en een publish-job hoort van een schone install te
          # komen, net als release.yml.
          package-manager-cache: false

      - name: Check store credentials
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          missing=""
          for v in FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Configure them under Settings > Secrets and variables > Actions before Firefox publishing can work."
            exit 1
          fi

      - name: Download Firefox Artifact
        id: download_artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Release assets worden pas na het publiceren van de release geüpload,
          # dus wachten met retries in plaats van direct falen op de race.
          for i in $(seq 1 10); do
            gh release download "$RELEASE_TAG" -p "Rolodink-firefox-*.zip" --clobber || true
            if ls Rolodink-firefox-*.zip >/dev/null 2>&1; then
              break
            fi
            echo "Firefox asset not available yet (attempt $i/10), waiting 30s..."
            sleep 30
          done
          if ! ls Rolodink-firefox-*.zip >/dev/null 2>&1; then
            echo "::error::No Rolodink-firefox-*.zip asset found on release $RELEASE_TAG"
            exit 1
          fi
          echo "zip_file=$(ls Rolodink-firefox-*.zip)" >> $GITHUB_OUTPUT

      - name: Unzip Artifact
        env:
          ZIP_FILE: ${{ steps.download_artifact.outputs.zip_file }}
        run: unzip "$ZIP_FILE" -d firefox-source

      # web-ext komt uit tools/firefox-sign, exact gepind met lockfile. Tot
      # oktober 2026 was dit `npm install -g web-ext`: ongepind, dus elke
      # publish draaide de versie die die dag 'latest' was, met install-hooks
      # aan. De root-workspace hoeft web-ext niet meer mee te slepen (~214
      # pakketten in elke CI-install) en deze job krijgt een vaste versie.
      # Bijwerken: versie in tools/firefox-sign/package.json aanpassen en daar
      # `npm install --package-lock-only --ignore-scripts` draaien.
      - name: Install web-ext (pinned)
        working-directory: tools/firefox-sign
        run: npm ci --ignore-scripts

      - name: Publish to Mozilla Add-ons
        # web-ext leest WEB_EXT_API_KEY/WEB_EXT_API_SECRET zelf uit de omgeving;
        # secrets niet als CLI-argumenten doorgeven (zichtbaar in proceslijst).
        # Het binaire bestand uit de lockfile, geen npx (dat haalt bij een
        # ontbrekend pakket een willekeurige versie uit de registry).
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          tools/firefox-sign/node_modules/.bin/web-ext --version
          tools/firefox-sign/node_modules/.bin/web-ext sign \
            --channel listed \
            --source-dir firefox-source
