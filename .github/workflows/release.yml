name: Release Rolodink Extension

on:
  push:
    tags:
      - 'ext-v*'
  # Manual trigger, because a draft release created in the GitHub UI does NOT
  # create its tag until you publish it — so it never fires the `push: tags`
  # trigger above and never gets any zips attached. Running this workflow by
  # hand builds the packages and fills that draft in.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, without the ext-v prefix (e.g. 1.3.3). Must match manifest.json.'
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # setup-node v5 en later zetten npm-caching vanzelf aan zodra
          # package.json een packageManager-veld heeft, en dat heeft het.
          # Uit, zodat deze stap doet wat hij onder v4 deed; de releasebuild
          # hoort van een schone node_modules te komen.
          package-manager-cache: false

      # The version has to agree with the manifests, or the zips are named after
      # a version the extension does not report and the store rejects the
      # upload as a duplicate of the one already published.
      - name: Resolve and verify version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/ext-v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not x.y.z"
            exit 1
          fi
          for MANIFEST in linkedin-crm-extension/manifest.json linkedin-crm-extension/manifest-firefox.json; do
            MANIFEST_VERSION=$(node -p "require('./$MANIFEST').version")
            if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
              echo "::error::$MANIFEST says $MANIFEST_VERSION but this release is $VERSION - bump the manifests first"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing $VERSION"

      - name: Install UI Dependencies
        working-directory: linkedin-crm-extension/ui
        run: npm ci

      - name: Install Build Script Dependencies
        working-directory: linkedin-crm-extension
        run: npm install

      - name: Build Chrome Extension
        working-directory: linkedin-crm-extension
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: node build.js chrome

      - name: Build Edge Extension
        working-directory: linkedin-crm-extension
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: node build.js edge

      - name: Build Firefox Extension
        working-directory: linkedin-crm-extension
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: node build.js firefox

      - name: List Artifacts
        run: ls -lh dist/
        working-directory: .

      # RELEASE_NOTES_vX.Y.Z.md is the release's actual notes, written in the
      # version-bump PR. Until now nothing read it: this step ran envsubst over
      # the template unconditionally, so every published release carried the
      # template's placeholder text - "Brief summary of what's new in this
      # release." went out to users on v1.3.4 while a full, accurate
      # RELEASE_NOTES_v1.3.4.md sat unused in the repository.
      #
      # The template stays as the fallback for a release cut without notes, and
      # says so rather than pretending to be a summary.
      - name: Prepare Release Notes
        id: prepare_notes
        run: |
          NOTES="RELEASE_NOTES_v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_NOTES.md
            echo "Using $NOTES"
          else
            echo "::warning::$NOTES not found - falling back to the template. Write the notes before publishing."
            envsubst < .github/RELEASE_TEMPLATE.md > RELEASE_NOTES.md
          fi

      # tag_name is explicit because on a manual run GITHUB_REF is a branch, not
      # the tag. For a draft the tag is only created when you publish, so this
      # also fills in a draft that was started by hand in the UI.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ext-v${{ env.VERSION }}
          name: Rolodink v${{ env.VERSION }}
          files: |
            dist/Rolodink-chrome-*.zip
            dist/Rolodink-edge-*.zip
            dist/Rolodink-firefox-*.zip
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: true
          prerelease: false
