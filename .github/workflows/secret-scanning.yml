name: Secret Scanning

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # De actie scant het bereik base..head. Met een shallow clone zit de
          # base-commit er niet in, en dan geeft trufflehog "unable to resolve
          # commit: object not found", scant nul bytes, en meldt succes.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --only-verified
          # De actie is een wrapper die ghcr.io/trufflesecurity/trufflehog:$version
          # draait; zonder deze regel is dat :latest, en dan zegt de pin hierboven
          # niets over de scanner zelf. Let op de tag-vorm: ghcr publiceert
          # "3.97.1", niet "v3.97.1" - die laatste bestaat niet en geeft
          # "manifest unknown". Vandaag dezelfde image als :latest,
          # sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08.
          # Keerzijde: nieuwe detectors komen nu pas binnen als je dit ophoogt.
          version: 3.97.1

